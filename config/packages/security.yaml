security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    role_hierarchy:
        ROLE_ADMIN: [ROLE_OPERATOR, ROLE_AUDITOR]
        ROLE_OPERATOR: ROLE_AUDITOR
    providers:
        admins:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|assets)/
            security: false
        main:
            lazy: true
            provider: admins
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: admin
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
    access_control:
        - { path: ^/admin, roles: ROLE_AUDITOR }
